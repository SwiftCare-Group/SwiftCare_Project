spring:
  application:
    name: clinical-service

  config:
    import: optional:classpath:application-secrets.yml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/swiftcare}
    username: ${DB_USERNAME:swiftcare}
    password: ${DB_PASSWORD:swiftcare}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 300000
      keepalive-time: 120000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /api/v1

app:
  jwt:
    secret: ${JWT_SECRET:ThisIsALocalDevelopmentJwtSecretKeyThatIsAtLeast32CharactersLong123!}
    expiry-ms: ${JWT_EXPIRY_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
