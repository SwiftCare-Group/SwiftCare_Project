spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:60000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:240s}

          # Retry safe read-only requests while a Render service is waking.
          # POST requests such as login are not retried here.
          default-filters:
            - name: Retry
              args:
                retries: 4
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                  - HEAD
                  - OPTIONS
                backoff:
                  firstBackoff: 15s
                  maxBackoff: 40s
                  factor: 2
                  basedOnPreviousValue: false
                timeout: 150s

          routes:
            # ============================================================
            # IDENTITY SERVICE
            # ============================================================

            # Public GET endpoint used by the mobile app to wake and check
            # the identity service before submitting login credentials.
            #
            # Incoming:
            # GET /api/v1/system/identity-health
            #
            # Forwarded to:
            # GET /api/v1/actuator/health
            - id: identity-health
              order: -1
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/system/identity-health
                - Method=GET
              filters:
                - name: SetPath
                  args:
                    template: /api/v1/actuator/health

            # Single route for login, registration, token refresh,
            # patient details and profile operations.
            #
            # This replaces the previous duplicate identity-session and
            # identity-service route arrangement.
            - id: identity-service
              order: 0
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth,/api/v1/auth/**,/api/v1/patients,/api/v1/patients/**,/api/v1/profile,/api/v1/profile/**

            # ============================================================
            # CLINICAL SERVICE ADMIN ROUTES
            # ============================================================

            # Admin staff and doctor management.
            - id: clinical-admin
              uri: ${CLINICAL_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/admin/doctors,/api/v1/admin/doctors/**,/api/v1/admin/staff,/api/v1/admin/staff/**

            # ============================================================
            # APPOINTMENT SERVICE ADMIN ROUTES
            # ============================================================

            # Admin department configuration and statistics.
            - id: appointment-admin
              uri: ${APPOINTMENT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/admin/departments,/api/v1/admin/departments/**,/api/v1/admin/stats,/api/v1/admin/stats/**

            # ============================================================
            # APPOINTMENT SERVICE
            # ============================================================

            # Appointments, departments, slots and queue operations.
            - id: appointment-service
              uri: ${APPOINTMENT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/appointments,/api/v1/appointments/**,/api/v1/departments,/api/v1/departments/**,/api/v1/queue,/api/v1/queue/**

            # ============================================================
            # CLINICAL SERVICE
            # ============================================================

            # Doctors, consultations, records, prescriptions and labs.
            - id: clinical-service
              uri: ${CLINICAL_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/consultations,/api/v1/consultations/**,/api/v1/doctors,/api/v1/doctors/**,/api/v1/clinical-records,/api/v1/clinical-records/**,/api/v1/prescriptions,/api/v1/prescriptions/**,/api/v1/lab-orders,/api/v1/lab-orders/**

            # ============================================================
            # SYMPTOM SERVICE
            # ============================================================

            - id: symptom-service
              uri: ${SYMPTOM_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/symptoms,/api/v1/symptoms/**

            # ============================================================
            # SUBSCRIPTION SERVICE
            # ============================================================

            - id: subscription-service
              uri: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/subscriptions,/api/v1/subscriptions/**

            # ============================================================
            # NOTIFICATION SERVICE
            # ============================================================

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/notifications,/api/v1/notifications/**

          # ==============================================================
          # CORS
          # ==============================================================

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              "[/**]":
                allowedOriginPatterns:
                  - "${CORS_ALLOWED_ORIGIN_PATTERN:http://localhost:[*]}"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Accept
                  - X-Requested-With
                exposedHeaders:
                  - Location
                maxAge: 3600

server:
  port: ${PORT:8080}
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - gateway

  endpoint:
    health:
      probes:
        enabled: true

    gateway:
      access: read-only
